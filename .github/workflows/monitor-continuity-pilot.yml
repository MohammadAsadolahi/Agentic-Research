name: Monitor continuity synthetic pilot

on:
  push:
    paths:
      - 'experiments/monitor_continuity_pilot/**'
      - '.github/workflows/monitor-continuity-pilot.yml'
  pull_request:
    paths:
      - 'experiments/monitor_continuity_pilot/**'
      - '.github/workflows/monitor-continuity-pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic fixtures and export results
        run: |
          python3 experiments/monitor_continuity_pilot/runner.py --json monitor-pilot-results.json
          python3 -m unittest discover -s experiments/monitor_continuity_pilot -v
      - name: Attach evidence
        uses: actions/upload-artifact@v4
        with:
          name: monitor-continuity-pilot-results
          path: monitor-pilot-results.json
